openapi: 3.0.3
info:
  title: CloudBooster API
  version: 1.0.0
servers:
  - url: https://api.cloudbooster.io
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          description: Rate limit exceeded
          headers:
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Remaining requests in the current window
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
        '500':
          description: Internal server error
  /v1/me:
    get:
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded
          headers:
            X-RateLimit-Remaining:
              schema:
                type: integer
            Retry-After:
              schema:
                type: integer
        '500':
          description: Internal server error
  /v1/orgs/{id}/projects:
    get:
      operationId: getOrgProjects
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized
        '429':
          description: Rate limit exceeded
          headers:
            X-RateLimit-Remaining:
              schema:
                type: integer
            Retry-After:
              schema:
                type: integer
        '500':
          description: Internal server error
  /v1/auth/cli-exchange:
    post:
      operationId: postAuthCLIExchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CLIExchangeRequest'
      responses:
        '200':
          description: Token exchange result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CLIExchangeResponse'
        '429':
          description: Rate limit exceeded
          headers:
            X-RateLimit-Remaining:
              schema:
                type: integer
            Retry-After:
              schema:
                type: integer
        '500':
          description: Internal server error
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
    Project:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    CLIExchangeRequest:
      type: object
      properties:
        code:
          type: string
    CLIExchangeResponse:
      type: object
      properties:
        token:
          type: string
